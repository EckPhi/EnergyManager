version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
      POSTGRES_DB: energy_scheduler
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy -d energy_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://energy:energy@db:5432/energy_scheduler
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn energy_scheduler.web.app:create_app --factory --host 0.0.0.0 --port 8000"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://energy:energy@db:5432/energy_scheduler
    command: python -m energy_scheduler.background_jobs

volumes:
  pgdata:
