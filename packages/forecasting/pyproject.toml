[tool.poetry]
name = "energy-scheduler-forecasting"
version = "0.1.0"
description = "Consumption forecasting for the Energy Scheduler"
authors = ["EnergyManager Contributors"]
license = "Apache-2.0"
packages = [{ include = "energy_scheduler/forecasting", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
energy-scheduler-domain = { path = "../domain", develop = true }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
