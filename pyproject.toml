[tool.poetry]
name = "energy-scheduler"
version = "0.1.0"
description = "Intelligent energy device scheduler with provider-native price integration"
authors = ["EnergyManager Contributors"]
license = "Apache-2.0"
readme = "README.md"
package-mode = false
# Root is the dev meta-package — no installable packages here.
# Individual sub-packages live under packages/.

[tool.poetry.dependencies]
python = "^3.12"
energy-scheduler-domain = { path = "packages/domain", develop = true }
energy-scheduler-pricing = { path = "packages/pricing", develop = true }
energy-scheduler-scheduling = { path = "packages/scheduling", develop = true }
energy-scheduler-connectors = { path = "packages/connectors", develop = true }
energy-scheduler-persistence = { path = "packages/persistence", develop = true }
energy-scheduler-forecasting = { path = "packages/forecasting", develop = true }
energy-scheduler-web = { path = "packages/web", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
pytest-cov = "^6.0"
ruff = "^0.9"
mypy = "^1.14"
respx = "^0.23"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
src = ["packages/domain/src", "packages/pricing/src", "packages/scheduling/src", "packages/connectors/src", "packages/persistence/src", "packages/forecasting/src", "packages/web/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "packages/domain/src",
    "packages/pricing/src",
    "packages/scheduling/src",
    "packages/connectors/src",
    "packages/persistence/src",
    "packages/forecasting/src",
    "packages/web/src",
]
mypy_path = [
    "packages/domain/src",
    "packages/pricing/src",
    "packages/scheduling/src",
    "packages/connectors/src",
    "packages/persistence/src",
    "packages/forecasting/src",
    "packages/web/src",
]
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
